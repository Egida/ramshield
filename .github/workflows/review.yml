name: Review Pipeline

on:
  pull_request:
  push:
    branches: [master, main, develop]

permissions:
  contents: read

concurrency:
  group: review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  review:
    name: Contract, build, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Must match rust-toolchain.toml (nightly). Installing components on
      # stable leaves rustfmt/clippy missing on the overridden toolchain.
      - uses: dtolnay/rust-toolchain@nightly-2026-08-29
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install bpf-linker
        run: |
          curl -fsSL -o /tmp/bpf-linker.tar.zst \
            https://github.com/aya-rs/bpf-linker/releases/download/v0.11.1/bpf-linker-x86_64-unknown-linux-musl.tar.zst
          tar --zstd -xf /tmp/bpf-linker.tar.zst -C /tmp
          sudo mv /tmp/bpf-linker /usr/local/bin/
          bpf-linker --version

      - name: Run review pipeline
        run: bash scripts/review_pipeline.sh

      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-report-${{ github.sha }}
          path: .review/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
name: Mesh Workflow Diagnostic

on:
  push:
    branches:
      - 'automation/mesh-acceptance-watch-20261011'
    paths:
      - '.github/workflows/mesh-acceptance-watch.yml'
      - '.github/workflows/mesh-acceptance-diagnostic.yml'

permissions:
  contents: read

jobs:
  actionlint:
    name: Diagnose acceptance workflow syntax and expressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          version=1.7.7
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" -o "$RUNNER_TEMP/actionlint.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version
      - name: Lint the acceptance workflow
        run: "$RUNNER_TEMP/actionlint" -color .github/workflows/mesh-acceptance-watch.yml

name: Independent Review Log

# Collects the independent review remarks about commits on `master` into
# the review log, on the hour.
#
# The remarks are posted by the independent reviewer to the agent handoff
# issue (#31). This workflow reads them and writes them into
# `REVIEW_LOG/` on the `feature/independent-review-log` branch:
#
#   REVIEW_LOG/commits/<sha>.md  - one file per reviewed commit. A file
#                                  that already exists is never touched.
#   REVIEW_LOG/INDEX.md          - a table of every review, regenerated.
#   REVIEW_LOG/BRANCH_COMMITS.md - this branch's own commits, appended to.
#
# A scheduled workflow only runs from the default branch, so this file
# has to reach `master` for the schedule to fire. The log itself is
# committed to the log branch, so `master` never carries it.
on:
  schedule:
    # Hourly, off the top of the hour: every workflow on the hour at :00
    # competes for the same runners.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: independent-review-log
  cancel-in-progress: false

env:
  LOG_BRANCH: feature/independent-review-log
  ISSUE_NUMBER: "31"

jobs:
  collect:
    name: Collect the review remarks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The log branch is created if it does not exist yet, so the first
      # run works before anyone has pushed it. A checkout with a ref that
      # does not exist fails the job.
      - name: Switch to the log branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "${LOG_BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${LOG_BRANCH}"
            git checkout "${LOG_BRANCH}"
          else
            echo "the log branch does not exist yet - creating it"
            git checkout -b "${LOG_BRANCH}"
          fi
          echo "on $(git rev-parse --abbrev-ref HEAD)"

      - name: Read the issue's comments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            --paginate > comments.json
          echo "comments: $(jq 'length' comments.json)"

      - name: Collect the remarks into the log
        run: |
          set -euo pipefail
          python3 scripts/independent_review_log.py \
            --comments comments.json \
            --log-dir REVIEW_LOG \
            --repo . | tee summary.txt
          {
            echo "## Independent review log"
            echo
            cat summary.txt
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Commit the log
        run: |
          set -euo pipefail
          # Only ever write to the log branch.
          if [[ "$(git rev-parse --abbrev-ref HEAD)" != "${LOG_BRANCH}" ]]; then
            echo "::error::refusing to commit the log from $(git rev-parse --abbrev-ref HEAD)"
            exit 1
          fi
          if git diff --quiet -- REVIEW_LOG/; then
            echo "the log is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add REVIEW_LOG/
          git commit -m "docs(review): collect the review remarks

          Regenerated by scripts/independent_review_log.py from the agent
          handoff issue. The log lives on this branch so master stays clean.

          Co-Authored-By: Claude Opus 4.8 (1M context) <noreply@anthropic.com>"
          git push origin "HEAD:${LOG_BRANCH}"

      - name: Check the collector's contract
        run: python3 scripts/test_independent_review_log.py

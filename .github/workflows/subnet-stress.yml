name: Subnet Stress Pin

# Pins scripts/subnet_stress.py — the sparse-/24 swarm probe written for the
# promote-gate fix. Without a caller, the script rots: it depends on the
# IPC contract, the /api/snapshot field names, and the gate thresholds all
# staying put. This job fails loudly when any of them drift.
#
# Nightly + on master + manual. Not on PRs: it boots a real daemon and
# drives 4,800 events, which belongs off the per-PR critical path.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: subnet-stress-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  subnet-stress:
    name: Sparse /24 swarm
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked --features full

      # config.stress.toml already binds 127.0.0.1:7890 / :9999 — exactly the
      # ports subnet_stress.py targets, and loopback so the fail-closed
      # public-bind rule (Config::validate) is satisfied without credentials.
      # --no-xdp: CI has no privileged BPF; the userspace store is the source
      # of truth and this probe only exercises detection -> promotion.
      - name: Boot daemon and run subnet stress
        run: |
          set -Eeuo pipefail
          ./target/release/ramshield --config config.stress.toml --no-xdp \
            > /tmp/ramshield-subnet-stress.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT

          for _ in $(seq 1 60); do
            if curl -sf -m 1 http://127.0.0.1:9999/healthz >/dev/null 2>&1; then
              break
            fi
            sleep 0.5
          done
          curl -sf -m 2 http://127.0.0.1:9999/healthz >/dev/null \
            || { echo "daemon never became healthy"; cat /tmp/ramshield-subnet-stress.log; exit 1; }

          python3 scripts/subnet_stress.py

      - name: Upload daemon log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subnet-stress-daemon-${{ github.sha }}
          path: /tmp/ramshield-subnet-stress.log
          if-no-files-found: warn
          retention-days: 14
# Minimal RamShield config for testing — all fields required by schema.
# auth_keys must NOT be the dev pattern (k1:0123...); use a real hex key.

[engine]
worker_threads = 0
ram_limit_mb = 1024
shard_count = 256

[detection]
# Tuned low thresholds so detection fires within test time budget.
rps_threshold = 50
rate_window_secs = 1
promote_min_events = 2
subnet_batch_threshold = 8
subnet_batch_min_events = 40
batch_block_enabled = true
batch_window_ms = 25
batch_max_events = 4096
pre_aggs_flush_interval_ms = 250
pre_aggs_max_size = 1000000
bloom_bits = 8000000

# Mesh — CRDT-based cluster coordination.
[mesh]
enabled = true
peers = [{ address = "127.0.0.1:8080", auth_key = "k1:abcdef0123456789abcdef0123456789abcdef01" }]

[ipc]
tcp_addr = "127.0.0.1:7890"
max_connections = 1000
max_line_length = 262144
require_auth = true
auth_keys = ["k1:abcdef0123456789abcdef0123456789abcdef0123456789abcdef01234567"]
key_roles = [{ key_id = "k1", role = "Admin" }]

[dashboard]
enabled = true
http_addr = "127.0.0.1:9999"
block_log_size = 1000

[wal]
enabled = true
dir = "/tmp/rs-min-wal"
durability = "GroupCommit"
compress = false
seg_max_bytes = 1048576
retention_max_bytes = 10485760

[forecasting]
enabled = false
ewma_alpha = 0.3
hw_beta = 0.5
hw_gamma = 0.7
seasonality_period = 30
anomaly_zscore = 2.0
min_entropy = 0.5
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ramshield-node-guard
  namespace: ramshield
  labels:
    app.kubernetes.io/name: ramshield
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ramshield
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ramshield
    spec:
      serviceAccountName: ramshield
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # XDP attaches to the host interface; the daemon must see the host
      # network namespace and its pinned BPF prefix.
      tolerations:
        - operator: Exists
      containers:
        - name: ramshield
          image: ghcr.io/grep999/ramshield:0.2.0
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/ramshield/config.toml"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              add:
                - NET_ADMIN
                - BPF
                - PERFMON
            # BPF map creation needs CAP_BPF; drop everything else the
            # container does not need.
            allowPrivilegeEscalation: false
          env:
            - name: RUST_LOG
              value: "info,ramshield=debug"
            - name: RAMSHIELD_DASHBOARD__ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: ramshield-admin
                  key: argon2-hash
                  optional: true
            - name: RAMSHIELD_IPC__AUTH_KEYS
              valueFrom:
                secretKeyRef:
                  name: ramshield-admin
                  key: ipc-auth-key
                  optional: false
          ports:
            - name: ipc
              containerPort: 7890
              protocol: TCP
            - name: dashboard
              containerPort: 9999
              protocol: TCP
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "4000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9999
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9999
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/ramshield
              readOnly: true
            - name: bpf-fs
              mountPath: /sys/fs/bpf
              # HostPath + Bidirectional propagation so BPF pins created by
              # the container are visible to the host and other pods.
              mountPropagation: Bidirectional
            - name: shm
              mountPath: /dev/shm
            - name: wal-data
              mountPath: /var/lib/ramshield
      volumes:
        - name: config
          configMap:
            name: ramshield-config
        - name: bpf-fs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
        - name: wal-data
          hostPath:
            path: /var/lib/ramshield
            type: DirectoryOrCreate
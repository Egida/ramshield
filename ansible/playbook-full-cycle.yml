---
# Full dev-to-deploy cycle: CONCEPT → EXECUTION → RELEASE → QUALITY → DEPLOY → PROTECTION
# Usage: ansible-playbook -e deploy_mode=systemd ansible/playbook-full-cycle.yml
#        ansible-playbook -e deploy_mode=k8s ansible/playbook-full-cycle.yml
- hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/default.yml

  roles:
    - concept
    - execution
    - release
    - quality

---
- name: QUALITY — verify CI workflows on pushed SHA
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/default.yml

  tasks:
    - name: Fetch current commit SHA
      command: git -C "{{ project_dir }}" rev-parse HEAD
      register: pushed_sha
      changed_when: false

    - name: Check CI workflows via gh CLI
      shell: |
        set -e
        cd "{{ project_dir }}"
        pass=true
        for wf_name in {{ ci_workflows | join(' ') }}; do
          status=$(gh run list --branch "{{ branch }}" --limit 1 \
            --workflow "$wf_name" \
            --json=conclusion 2>/dev/null | \
            jq -r '.[0].conclusion // "no_runs"' 2>/dev/null || echo "no_runs")
          
          echo "Workflow: $wf_name → $status"
          
          if [ "$status" != "success" ]; then
            pass=false
          fi
        done
        
        if [ "$pass" = true ]; then
          echo "ALL_WORKFLOWS=PASS"
        else
          echo "ALL_WORKFLOWS=FAIL"
        fi
      args:
        executable: /bin/bash
      register: ci_result
      changed_when: false

    - name: Report CI status
      ansible.builtin.debug:
        msg: "{{ ci_result.stdout_lines | default(['(no output)']) | join('\n') }}"

    - name: Replay failed workflow runs
      shell: |
        set -e
        cd "{{ project_dir }}"
        for wf_name in {{ ci_workflows | join(' ') }}; do
          status=$(gh run list --branch "{{ branch }}" --limit 1 \
            --workflow "$wf_name" \
            --json=conclusion 2>/dev/null | \
            jq -r '.[0].conclusion // "no_runs"' 2>/dev/null || echo "no_runs")
          
          if [ "$status" = "failure" ]; then
            run_id=$(gh run list --branch "{{ branch }}" --limit 1 \
              --workflow "$wf_name" \
              --json=databaseId 2>/dev/null | \
              jq -r '.[0].databaseId // empty' 2>/dev/null || echo "")
            
            if [ -n "$run_id" ]; then
              echo "Replaying workflow: $wf_name (run #${run_id})"
              gh run rerun "$run_id" 2>/dev/null || echo "  (rerun failed for $wf_name)"
            fi
          fi
        done
      args:
        executable: /bin/bash
      register: rerun_result
      changed_when: false
      failed_when: false

    - name: Report rerun status
      ansible.builtin.debug:
        msg: "{{ rerun_result.stdout_lines | default(['(no output)']) | join('\n') }}"

    - name: Abort if any workflow still failed after replay
      ansible.builtin.fail:
        msg: "CI verification FAILED — one or more workflows are not green:\n{{ ci_result.stdout | default('(could not verify)') }}"
      when: >-
        (ci_result.stdout | default('')) is search('ALL_WORKFLOWS=FAIL') or
        (ci_result.rc | default(0)) != 0
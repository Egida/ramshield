---
# vars/default.yml — fill these per project/context
# skeleton remains the same; only values change.

project_dir: "/home/m/vehicle_of_rationalism/ramshield/beta/rs"
remote: "origin"
branch: "master"

# Which cargo gates to run (in order)
gates:
  - name: build
    cmd: "cargo build --all-targets --all-features --locked"
  - name: clippy
    cmd: "cargo clippy --workspace --all-targets -- -D warnings"
  - name: test
    cmd: "cargo test --workspace --locked --features full"
  - name: fmt
    cmd: "cargo fmt --check"

# GitHub Actions workflow names to poll after push
ci_workflows:
  - CI
  - lint-no-unwrap
  - Review Pipeline
  - Subnet Stress Pin

# CI poll settings
ci_poll_interval_seconds: 15
ci_poll_max_seconds: 300

# Commit message prefix convention
commit_prefix: "chore"

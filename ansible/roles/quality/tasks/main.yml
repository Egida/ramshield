---
- name: Fetch current commit SHA
  command: git -C "{{ project_dir }}" rev-parse HEAD
  register: pushed_sha
  changed_when: false

# Poll each workflow using Ansible native loop (avoids bash word-splitting on display names)
- name: Wait for CI workflow to complete on pushed SHA
  shell: |
    set -e
    cd "{{ project_dir }}"
    wf_name="{{ item }}"
    pushed_sha="{{ pushed_sha.stdout }}"
    waited=0
    while [ "$waited" -lt {{ ci_poll_max_seconds }} ]; do
      result=$(gh run list --branch "{{ branch }}" --limit 5 \
        --workflow "$wf_name" \
        --json headSha,conclusion,status 2>/dev/null | \
        jq -r --arg sha "$pushed_sha" \
          '.[] | select(.headSha == $sha) | "\(.status)|\(.conclusion // "")"' 2>/dev/null || echo "")
      if [ -n "$result" ]; then
        status=$(echo "$result" | head -1 | cut -d'|' -f1)
        conclusion=$(echo "$result" | head -1 | cut -d'|' -f2)
        if [ "$status" = "completed" ]; then
          echo "$wf_name -> $conclusion"
          exit 0
        fi
      fi
      sleep {{ ci_poll_interval_seconds }}
      waited=$((waited + ci_poll_interval_seconds))
    done
    echo "TIMEOUT"
    exit 1
  args:
    executable: /bin/bash
  register: ci_check
  changed_when: false
  failed_when: false
  loop: "{{ ci_workflows }}"
  loop_control:
    loop_var: item

- name: Report CI check results
  ansible.builtin.debug:
    msg: "Workflow '{{ item.item }}' -> {{ item.stdout_lines | default(['TIMEOUT']) | join(' ') | trim }}"
  loop: "{{ ci_check.results | default([]) }}"

- name: Check if any workflow failed or timed out
  set_fact:
    ci_failed: "{{ ci_check.results | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list | length > 0 }}"

# --- CI failure triage: fetch failing job logs, extract error lines ---
- name: Triage failing workflow runs
  shell: |
    set -e
    cd "{{ project_dir }}"
    wf_name="{{ item.item }}"
    pushed_sha="{{ pushed_sha.stdout }}"
    run_id=$(gh run list --branch "{{ branch }}" --limit 5 \
      --workflow "$wf_name" \
      --json headSha,databaseId 2>/dev/null | \
      jq -r --arg sha "$pushed_sha" '.[] | select(.headSha == $sha) | .databaseId' 2>/dev/null | head -1 || echo "")

    if [ -z "$run_id" ]; then
      echo "no run found for $wf_name at $pushed_sha"
      exit 0
    fi

    jobs_json=$(gh run view "$run_id" --json jobs 2>/dev/null || echo '{"jobs":[]}')
    for job_id in $(echo "$jobs_json" | jq -r '.jobs[] | select(.conclusion=="failure") | .databaseId' 2>/dev/null); do
      job_name=$(echo "$jobs_json" | jq -r --argjson id "$job_id" '.jobs[] | select(.databaseId == $id) | .name' 2>/dev/null)
      echo "=== FAILING JOB: $job_name ==="
      gh api "repos/:owner/:repo/actions/jobs/$job_id/logs" 2>/dev/null | \
        { gzip -dc 2>/dev/null || cat; } | \
        grep -nE 'error\[E[0-9]+\]|error:|could not compile|panicked|FAILED|test result: FAILED|clippy::' | \
        head -15 || echo "(no error lines found in log)"
    done
  args:
    executable: /bin/bash
  register: triage_result
  changed_when: false
  failed_when: false
  loop: "{{ ci_check.results | default([]) }}"
  loop_control:
    loop_var: item
  when: item.rc is defined and item.rc != 0

- name: Report triage results
  ansible.builtin.debug:
    msg: "{{ item.stdout | default('(no output)') }}"
  loop: "{{ triage_result.results | default([]) | selectattr('stdout', 'defined') | selectattr('stdout', 'ne', '') | list }}"

# Abort if any workflow failed (rerun left to human judgment — triage above shows why)
- name: Abort if any workflow failed
  ansible.builtin.fail:
    msg: "CI verification FAILED -- one or more workflows are not green:\n{{ ci_check.results | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | map(attribute='stdout') | list | join('\n') }}"
  when: ci_failed
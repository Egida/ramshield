---
- name: CONCEPT — understand what must change
  vars:
    concept_state_file: "{{ project_dir }}/.ansible-concept.md"
  
  block:
    - name: Log HEAD state
      command: git -C "{{ project_dir }}" log --oneline -3
      register: head_state
      
    - name: Log working tree
      command: git -C "{{ project_dir }}" status --short
      register: tree_state
      failed_when: false
      
    - name: Display current state
      debug:
        msg: |
          HEAD:
          {{ head_state.stdout_lines | default(["unknown"]) | join('\n') }}
          
          Uncommitted changes:
          {{ tree_state.stdout_lines | default(["(clean)"]) | join('\n') }}

    - name: Dump concept state for later phases
      copy:
        content: |
          # Concept — session state
          HEAD: {{ head_state.stdout_lines|first|default('unknown') }}
          Tree: {{ tree_state.stdout|default('clean') }}
        dest: "{{ concept_state_file }}"
        force: true

    - name: Acknowledge concept phase
      debug:
        msg: "Concept phase complete — review the state above before proceeding."
# Development config: XDP off, WAL off, IPC open, dashboard off.
# Use for local iteration without root/capabilities.
[engine]
shard_count = 16
worker_threads = 2
ram_limit_mb = 1024

[ipc]
tcp_addr = "127.0.0.1:7890"
max_connections = 1000
max_line_length = 1048576
# auth_keys = []  # empty = open (dev only)
# key_roles = []

[dashboard]
enabled = false
http_addr = "127.0.0.1:9999"
max_login_attempts = 5
max_password_length = 256

[wal]
enabled = false
dir = "/tmp/ramshield_wal_dev"
durability = "GroupCommit"
compress = false
seg_max_bytes = 1048576
retention_max_bytes = 10485760

[forecasting]
enabled = false

[detection]
rps_threshold = 500
rate_window_secs = 10
subnet_batch_threshold = 64
subnet_batch_min_events = 500
batch_block_enabled = true
block_ttl_secs = 60
pulse_window_secs = 5
pulse_threshold_samples = 3
subnet_burst_ttl_secs = 30
bloom_bits = 1_000_000
batch_max_events = 1024
batch_window_ms = 25
pre_aggs_flush_interval_ms = 250
promote_min_events = 4
subnet_window_threshold = 12
emergency_burst_threshold = 500
pre_aggs_max_size = 100_000

[xdp]
enabled = false
interface = "lo"
mode = "skb"
[package]
name = "ramwal"
version = "0.9.0-rc.1"
edition = "2024"
description = "Recovery-first append-only log for Rust — CRC-32C, deterministic recovery, checkpoint, retention"
license = "MIT"

[dependencies]
crc = "^3"
lz4_flex = "^0.12.1"

[[bin]]
name = "ramwal-cli"
path = "src/bin/cli.rs"

[[bench]]
name = "wal_bench"
harness = false

[dev-dependencies]
criterion = "0.8.2"

---
# Deploy + post-deploy protection standalone
# Usage: ansible-playbook -e deploy_mode=systemd ansible/deploy-solo.yml
#        ansible-playbook -e deploy_mode=k8s ansible/deploy-solo.yml
- name: Deploy and post-protect
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/default.yml

  pre_tasks:
    - name: Ensure release artifact exists
      command: ls target/release/ramshield
      args:
        chdir: "{{ project_dir }}"
      register: artifact_check
      changed_when: false
      failed_when: artifact_check.rc != 0

  roles:
    - deploy
    - protect

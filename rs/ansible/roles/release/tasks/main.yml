---
- name: Check for uncommitted changes
  command: git -C "{{ project_dir }}" status --porcelain
  register: porcelain
  changed_when: false

- name: Commit and push
  shell: |
    set -e
    cd "{{ project_dir }}"
    git add -A
    git commit -m "{{ commit_prefix }}: automated runbook commit [skip ci]"
    git push {{ remote }} {{ branch }}
  when: porcelain.stdout | length > 0
  register: push_result
  changed_when: push_result.rc == 0

- name: No changes to push
  debug:
    msg: "Working tree clean — nothing to commit."
  when: porcelain.stdout | length == 0

- name: Confirm branch is clean
  command: git -C "{{ project_dir }}" status --short
  register: post_push
  failed_when: post_push.stdout | length > 0
  when: porcelain.stdout | length > 0
---
- name: Run all gates in order
  ansible.builtin.command: "{{ gate.cmd }}"
  environment:
    CARGO_HOME: "{{ lookup('env', 'CARGO_HOME') | default(lookup('env', 'HOME') ~ '/.cargo', true) }}"
  args:
    chdir: "{{ project_dir }}"
  register: gate_results
  changed_when: false
  loop: "{{ gates }}"
  loop_control:
    loop_var: gate

- name: Summarize gate results
  ansible.builtin.debug:
    msg: "Gate '{{ item.gate.name }}' finished rc={{ item.rc }}"
  loop: "{{ gate_results.results | default([]) }}"
  loop_control:
    loop_var: item
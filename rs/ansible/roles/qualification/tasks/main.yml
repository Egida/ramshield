---
# QUALIFICATION — evaluate P1 #33 qualification matrix
# Runs scripts/qualification_check.sh and reports per-dimension status.
- name: Assert qualification_check.sh exists
  ansible.builtin.stat:
    path: "{{ project_dir }}/scripts/qualification_check.sh"
  register: qcheck

- name: Fail if missing
  ansible.builtin.fail:
    msg: "scripts/qualification_check.sh not found — run 'scripts/qualification_check.sh --quick' manually"
  when: not qcheck.stat.exists

- name: Run qualification matrix (--quick mode)
  ansible.builtin.command: bash scripts/qualification_check.sh --quick
  args:
    chdir: "{{ project_dir }}"
  register: qual_result
  changed_when: false
  failed_when: false
  timeout: "{{ ci_poll_max_seconds | default(300) }}"

- name: Report qualification results
  ansible.builtin.debug:
    var: qual_result.stdout_lines
  when: qual_result.stdout_lines | length > 0

- name: Warn on qualification gaps
  ansible.builtin.fail:
    msg: |
      Qualification matrix has failures.
      See docs/QUALIFICATION_MATRIX.md for the gap inventory.
      {{ qual_result.stderr_lines | default([]) }}
  when:
    - qual_result.rc != 0
    - qual_fail_gate | default(false) | bool
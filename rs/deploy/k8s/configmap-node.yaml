apiVersion: v1
kind: ConfigMap
metadata:
  name: ramshield-node-config
  namespace: ramshield
  labels:
    app.kubernetes.io/name: ramshield
data:
  config.toml: |
    # Host-network node guard: XDP is the kernel dataplane.
    # Control surfaces remain loopback-only; manage through host-local tooling
    # or an explicitly configured TLS/mTLS proxy.
    [engine]
    shard_count = 256
    worker_threads = 0
    ram_limit_mb = 1536  # 2Gi container — leave ~512 MiB headroom for runtime/allocator/WAL

    [ipc]
    tcp_addr = "127.0.0.1:7890"
    max_connections = 1024
    max_line_length = 262144

    [dashboard]
    enabled = true
    http_addr = "127.0.0.1:9999"

    [forecasting]
    enabled = true
    ewma_alpha = 0.3
    hw_beta = 0.1
    hw_gamma = 0.1
    seasonality_period = 60
    anomaly_zscore = 3.0
    min_entropy = 4.5

    [wal]
    enabled = true
    dir = "/var/lib/ramshield/wal"
    durability = "GroupCommit"
    compress = true
    seg_max_bytes = 67108864
    retention_max_bytes = 536870912

    [xdp]
    enabled = true
    interface = "eth0"
    mode = "drv"
    require_native_for_autonomous = true
    allow_inband_fallback = false

    [native_ingest]
    enabled = true
    interface = "eth0"
    max_events_per_sec = 20000

    [autonomous]
    enabled = true
    syn_pps_per_cpu = 25000
    udp_pps_per_cpu = 50000
    packet_pps_per_cpu = 200000
    window_ms = 100

    [synproxy]
    # Node-guard uses the host-tooling image, which includes nft/sysctl.
    # This is intentionally enabled here; the ordinary server Deployment keeps
    # SYNPROXY disabled because it does not own the host network namespace.
    enabled = true
    ports = [22, 53, 80, 443]
    mss = 1460
    wscale = 7
    max_connections_per_source = 128
    max_connections_total = 16384
    new_connections_per_second = 50
    new_connection_burst = 100
    new_connections_total_per_second = 2000
    new_connection_total_burst = 4000
